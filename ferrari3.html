<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>LaFerrari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { padding-top: 90px; background-color: #00000089; font-family: Arial; }
    .navbar { position: fixed; top: 0; width: 100%; background: transparent; }
    .navbar-rounded {
      background-color: #121212;
      border-radius: 14px;
      padding: 0.6rem 1.5rem;
      margin: 8px auto;
      max-width: 1320px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }
    .ferrari-logo { height: 45px; }
    h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
    .box-testo {
      background-color: #f0f0f0;
      padding: 30px;
      max-width: 1000px;
      margin: 40px auto;
      border-radius: 10px;
      text-align: center;
    }
    footer { background-color: #111; color: white; }
    img { border-radius: 10px; }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid navbar-rounded">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <img src="https://logos-world.net/wp-content/uploads/2020/06/Ferrari-Logo.png" class="ferrari-logo">
      <span>Maranello Museum</span>
    </a>
  </div>
</nav>

<h1 class="text-center my-4">LaFerrari</h1>

<section class="box-testo shadow">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9JPWUq_Xg4NnPlWMUpUnUvM5TVoGacB9VMA&s" class="img-fluid mb-4">

  <p>
    <strong>LaFerrari</strong> rappresenta il massimo dell’innovazione Ferrari.
    È la prima hypercar ibrida della casa di Maranello.
  </p>

  <p>
    Grazie al sistema HY-KERS, unisce un motore V12 aspirato a un motore elettrico,
    raggiungendo prestazioni straordinarie.
  </p>
</section>

<footer class="text-center py-4">
  <p class="mb-1">© 2026 Museo Ferrari – Maranello</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
